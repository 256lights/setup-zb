name: Test
on:
  push:
  pull_request:
jobs:
  test:
    name: Test
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - run: npm install
      - run: npm test
  bundle:
    name: Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - name: Ensure bundle matches source
        run: git diff --name-only --exit-code -- dist
